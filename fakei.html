    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Tracker</title>

    <header>
        <h1>🏆 Student Point Tracker</h1>

        </div>

        <p class="data-note">Data last updated: <span id="lastUpdated">Loading...</span></p>
    </main>

    </footer>

    <script src="script.js"></script>
